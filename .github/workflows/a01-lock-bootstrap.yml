name: A01 dependency lock bootstrap

on:
  push:
    branches:
      - remediation/trust-boundary-phase-1

permissions:
  contents: write

jobs:
  bootstrap:
    if: ${{ !hashFiles('uv.lock') || !hashFiles('autonomous-api/uv.lock') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Install uv
        run: python -m pip install --disable-pip-version-check "uv==0.10.0"

      - name: Resolve root project
        run: uv lock

      - name: Resolve autonomous-api project
        working-directory: autonomous-api
        run: uv lock

      - name: Verify lockfiles
        run: |
          set -euo pipefail
          test -s uv.lock
          test -s autonomous-api/uv.lock
          uv lock --check
          (cd autonomous-api && uv lock --check)

      - name: Commit resolved locks
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock autonomous-api/uv.lock
          git diff --cached --quiet && exit 0
          git commit -m "build: add deterministic Python dependency locks"
          git push origin HEAD:${GITHUB_REF_NAME}
