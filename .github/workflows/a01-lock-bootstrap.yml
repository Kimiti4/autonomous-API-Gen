name: A01 dependency lock bootstrap

on:
  push:
    branches:
      - remediation/trust-boundary-phase-1

permissions:
  contents: write

jobs:
  bootstrap:
    if: ${{ !hashFiles('uv.lock') || !hashFiles('autonomous-api/uv.lock') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e3c3d8f6e6e7b2c9f8a4f3c5f7d8a9b0c1 # v7.0.1
        with:
          persist-credentials: true

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.12"

      - name: Resolve root project
        run: uv lock

      - name: Resolve autonomous-api project
        working-directory: autonomous-api
        run: uv lock

      - name: Verify both lockfiles are present
        run: |
          test -s uv.lock
          test -s autonomous-api/uv.lock

      - name: Commit locks and remove bootstrap workflow
        run: |
          set -euo pipefail
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          git add uv.lock autonomous-api/uv.lock
          git rm .github/workflows/a01-lock-bootstrap.yml
          git commit -m "build: add deterministic Python dependency locks"
          git push origin HEAD:${GITHUB_REF_NAME}
