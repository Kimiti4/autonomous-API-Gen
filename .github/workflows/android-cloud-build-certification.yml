name: ESAP Android Cloud-Build Certification (Stage A)

on:
  workflow_dispatch:
    inputs:
      candidate_id:
        description: "Evidence candidate identifier"
        required: true
        type: string
      source_revision:
        description: "Exact commit SHA containing the source, ISR revision and derivation manifest"
        required: true
        type: string
      source_spec_path:
        description: "Repository-relative authoritative ESAP-APP-001 specification path"
        required: true
        type: string
      isr_revision_path:
        description: "Repository-relative serialized campaign ISRRevision JSON"
        required: true
        type: string
      derivation_manifest_path:
        description: "Repository-relative human-approved source-to-ISR binding manifest JSON"
        required: true
        type: string
      expected_derivation_manifest_sha256:
        description: "SHA-256 of the approved derivation manifest"
        required: true
        type: string
  pull_request:
    paths:
      - "compiler/backends/android.py"
      - "compiler/composition.py"
      - "certification/campaign/android_structural_runner.py"
      - "tests/test_android_campaign_backend.py"
      - "tests/test_android_structural_runner.py"
      - ".github/workflows/android-cloud-build-certification.yml"

permissions:
  contents: read

jobs:
  android-backend-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pydantic fastapi
      - name: Run Android campaign backend contract tests
        run: python -m pytest -q tests/test_android_campaign_backend.py tests/test_android_structural_runner.py

  android-cloud-build:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      CANDIDATE_ROOT: /tmp/esap-android-candidate
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_revision }}
          fetch-depth: 0

      - name: Verify exact checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ inputs.source_revision }}"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          api-level: "35"
          build-tools: "35.0.0"
          components: "platform-tools"
      - uses: gradle/actions/setup-gradle@v4

      - name: Install compiler dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pydantic fastapi

      - name: Validate benchmark source and approved ISR derivation
        id: source_binding
        env:
          SOURCE_SPEC_PATH: ${{ inputs.source_spec_path }}
          ISR_REVISION_PATH: ${{ inputs.isr_revision_path }}
          DERIVATION_MANIFEST_PATH: ${{ inputs.derivation_manifest_path }}
          EXPECTED_MANIFEST_SHA256: ${{ inputs.expected_derivation_manifest_sha256 }}
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          from isr.core.revision import ISRRevision

          def read_repo_file(key):
              value = os.environ[key]
              path = Path(value)
              if not value or path.is_absolute() or ".." in path.parts or not path.is_file():
                  raise SystemExit(f"invalid or missing repository file for {key}: {value!r}")
              return path, path.read_bytes()

          spec_path, spec_bytes = read_repo_file("SOURCE_SPEC_PATH")
          revision_path, revision_bytes = read_repo_file("ISR_REVISION_PATH")
          manifest_path, manifest_bytes = read_repo_file("DERIVATION_MANIFEST_PATH")

          manifest_sha = hashlib.sha256(manifest_bytes).hexdigest()
          if manifest_sha != os.environ["EXPECTED_MANIFEST_SHA256"].lower():
              raise SystemExit("approved derivation manifest SHA-256 mismatch")
          manifest = json.loads(manifest_bytes)
          required = {
              "schema_version", "benchmark_id", "source_spec_path",
              "source_spec_sha256", "isr_revision_path",
              "isr_revision_file_sha256", "isr_revision_content_hash"
          }
          missing = sorted(required - set(manifest))
          if missing:
              raise SystemExit(f"derivation manifest missing fields: {missing}")
          if manifest["schema_version"] != "1" or manifest["benchmark_id"] != "ESAP-APP-001":
              raise SystemExit("unsupported derivation manifest schema or benchmark identity")
          actual_spec_sha = hashlib.sha256(spec_bytes).hexdigest()
          actual_revision_sha = hashlib.sha256(revision_bytes).hexdigest()
          if manifest["source_spec_path"] != str(spec_path):
              raise SystemExit("source specification path differs from approved manifest")
          if manifest["source_spec_sha256"] != actual_spec_sha:
              raise SystemExit("source specification bytes differ from approved manifest")
          if manifest["isr_revision_path"] != str(revision_path):
              raise SystemExit("ISR revision path differs from approved manifest")
          if manifest["isr_revision_file_sha256"] != actual_revision_sha:
              raise SystemExit("ISR revision bytes differ from approved manifest")
          revision = ISRRevision.model_validate_json(revision_bytes)
          if manifest["isr_revision_content_hash"] != revision.content_hash:
              raise SystemExit("ISR revision content hash differs from approved manifest")
          print(json.dumps({
              "benchmark_id": manifest["benchmark_id"],
              "source_spec_path": str(spec_path),
              "source_spec_sha256": actual_spec_sha,
              "isr_revision_path": str(revision_path),
              "isr_revision_file_sha256": actual_revision_sha,
              "isr_revision_content_hash": revision.content_hash,
              "derivation_manifest_path": str(manifest_path),
              "derivation_manifest_sha256": manifest_sha
          }, sort_keys=True))
          PY

      - name: Generate campaign-native Android candidate and run bound build on emulator
        id: android_execution
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          script: |
          ISR_REVISION_PATH: ${{ inputs.isr_revision_path }}
          CANDIDATE_ID: ${{ inputs.candidate_id }}
          SOURCE_REVISION: ${{ inputs.source_revision }}
          SOURCE_SPEC_PATH: ${{ inputs.source_spec_path }}
          DERIVATION_MANIFEST_PATH: ${{ inputs.derivation_manifest_path }}
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          from isr.core.revision import ISRRevision
          from compiler.backends.android import compile_isr_revision
          from certification.campaign.android_structural_runner import NativeAndroidStructuralRunner

          revision_bytes = Path(os.environ["ISR_REVISION_PATH"]).read_bytes()
          revision = ISRRevision.model_validate_json(revision_bytes)
          candidate = compile_isr_revision(revision)
          result = NativeAndroidStructuralRunner(timeout_seconds=2400).execute_bound(
              revision=revision,
              candidate=candidate,
              candidate_root=os.environ["CANDIDATE_ROOT"],
              require_emulator=True,
          )
          evidence = result.to_dict()
          evidence.update({
              "candidate_id": os.environ["CANDIDATE_ID"],
              "source_revision": os.environ["SOURCE_REVISION"],
              "source_spec_path": os.environ["SOURCE_SPEC_PATH"],
              "source_spec_sha256": hashlib.sha256(
                  Path(os.environ["SOURCE_SPEC_PATH"]).read_bytes()
              ).hexdigest(),
              "isr_revision_file_sha256": hashlib.sha256(revision_bytes).hexdigest(),
              "derivation_manifest_path": os.environ["DERIVATION_MANIFEST_PATH"],
          })
          root = Path(os.environ["CANDIDATE_ROOT"])
          (root / "android-cloud-build-evidence.json").write_text(
              json.dumps(evidence, sort_keys=True, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps({
              "passed": result.passed,
              "verdict": result.verdict,
              "revision_hash": result.revision_hash,
              "plan_hash": result.plan_hash,
              "candidate_hash": result.candidate_hash,
              "apk_hash": result.apk_hash,
              "stages": [{"stage": x.stage, "passed": x.passed, "exit_code": x.exit_code}
                         for x in result.evidence]
          }, sort_keys=True))
          if not result.passed:
              raise SystemExit("Android structural cloud execution did not pass all required stages")
          PY

      - name: Preserve structural-only verdict
        if: always()
        run: |
          echo "ESAP-APP-001 remains BLOCKED unless independent semantic and runtime acceptance gates are separately satisfied."
          echo "A successful Gradle/APK/emulator structural run is not benchmark certification."

      - name: Upload source-bound candidate and cloud evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: esap-android-cloud-evidence-${{ inputs.candidate_id }}
          path: |
            /tmp/esap-android-candidate/
          if-no-files-found: warn
