name: Bucket 4.2 Focused Gate

on:
  pull_request:
    paths:
      - "autonomous-api/app/engine/deployed_app_observation.py"
      - "autonomous-api/app/engine/governed_maintenance_record.py"
      - "autonomous-api/app/engine/governed_maintenance_execution.py"
      - "autonomous-api/tests/test_deployed_app_observation.py"
      - "autonomous-api/tests/test_governed_maintenance_record.py"
      - "autonomous-api/tests/test_governed_maintenance_execution.py"
      - "docs/bucket-4-2-deployed-app-observation.md"
      - ".github/workflows/bucket-4-2-focused.yml"
  push:
    paths:
      - "autonomous-api/app/engine/deployed_app_observation.py"
      - "autonomous-api/app/engine/governed_maintenance_record.py"
      - "autonomous-api/tests/test_deployed_app_observation.py"
      - "autonomous-api/tests/test_governed_maintenance_record.py"
      - "docs/bucket-4-2-deployed-app-observation.md"
      - ".github/workflows/bucket-4-2-focused.yml"

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    defaults:
      run:
        working-directory: autonomous-api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest
      - name: Run Bucket 4.2 focused tests
        run: pytest tests/test_deployed_app_observation.py tests/test_governed_maintenance_record.py tests/test_governed_maintenance_execution.py -q
