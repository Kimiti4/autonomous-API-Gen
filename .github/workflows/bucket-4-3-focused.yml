name: Bucket 4.3 Focused Gate

on:
  pull_request:
    paths:
      - "autonomous-api/app/engine/work_mode.py"
      - "autonomous-api/tests/test_work_mode.py"
      - "autonomous-api/tests/test_work_mode_surface_modes.py"
      - "autonomous-api/tests/test_work_mode_scope_validation.py"
      - "autonomous-api/tests/test_work_capability.py"
      - "docs/bucket-4-3-granular-project-modes.md"
      - ".github/workflows/bucket-4-3-focused.yml"
  push:
    paths:
      - "autonomous-api/app/engine/work_mode.py"
      - "autonomous-api/tests/test_work_mode.py"
      - "autonomous-api/tests/test_work_mode_surface_modes.py"
      - "autonomous-api/tests/test_work_mode_scope_validation.py"
      - "autonomous-api/tests/test_work_capability.py"
      - "docs/bucket-4-3-granular-project-modes.md"
      - ".github/workflows/bucket-4-3-focused.yml"

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    defaults:
      run:
        working-directory: autonomous-api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest
      - name: Run Bucket 4.3 focused tests
        run: |
          pytest             tests/test_work_mode.py             tests/test_work_mode_surface_modes.py             tests/test_work_mode_scope_validation.py             tests/test_work_capability.py             -q
