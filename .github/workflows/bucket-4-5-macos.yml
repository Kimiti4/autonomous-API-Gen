name: Bucket 4.5 macOS Generation
on:
  pull_request:
    paths:
      - "autonomous-api/app/engine/macos_generation.py"
      - "autonomous-api/tests/test_macos_generation.py"
      - ".github/workflows/bucket-4-5-macos.yml"
  workflow_dispatch:
jobs:
  macos-contract:
    runs-on: macos-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    defaults:
      run:
        working-directory: autonomous-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m pytest tests/test_macos_generation.py -q
