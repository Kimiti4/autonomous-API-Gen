name: CBC-1 Campaign A

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cbc1-campaign-a-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  campaign-a:
    name: Campaign A (13 categories × 2 backends)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: autonomous-api/requirements*.txt
      - name: Install platform dependencies
        run: pip install -r autonomous-api/requirements.txt -r autonomous-api/requirements-dev.txt
      - name: Run Campaign A
        run: bash release/run-campaign-a.sh
      - name: Archive behavioral evidence ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cbc1-a-evidence
          path: release/evidence/
          retention-days: 180
