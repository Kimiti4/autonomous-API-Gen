name: autonomous-api CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    working-directory: autonomous-api

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: esap
          POSTGRES_PASSWORD: esap
          POSTGRES_DB: esap_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U esap -d esap_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_PG_DSN: postgresql+asyncpg://esap:esap@127.0.0.1:5432/esap_test
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-cov
      - name: Run unit tests
        run: pytest tests/ -v --tb=short --cov=app --cov-report=xml
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./autonomous-api/coverage.xml
          fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install -e . flake8 black mypy
      - name: Run Flake8
        run: flake8 app/ --count --select=E9,F63,F7,F82 --show-source --statistics
      - name: Run Black check
        run: black app/ --check

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Bandit
        run: pip install bandit
      - name: Run Bandit security scan
        run: bandit -r app/ -f json -o bandit-report.json
      - name: Upload security report
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: autonomous-api/bandit-report.json

  build-docker:
    runs-on: ubuntu-latest
    needs: [test, lint]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t evolution-engine:${{ github.sha }} .
      - name: Smoke test Docker image
        run: docker run --rm evolution-engine:${{ github.sha }} python -c "from app.main import app; print('Docker build OK')"