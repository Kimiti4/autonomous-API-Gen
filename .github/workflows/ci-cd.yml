name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: autonomous-api/requirements.txt
      - name: Install dependencies
        working-directory: autonomous-api
        run: pip install -r requirements.txt
      - name: Run tests
        working-directory: autonomous-api
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/testdb
        run: pytest -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: autonomous-api/requirements.txt
      - name: Install linters
        working-directory: autonomous-api
        run: |
          python -m pip install --upgrade pip
          pip install -e . flake8 black mypy
      - name: Run Flake8 source guard
        working-directory: autonomous-api
        run: flake8 app/ --count --select=E9,F63,F7,F82 --show-source --statistics
      - name: Generate representative candidate for template linting
        working-directory: autonomous-api
        run: |
          python - <<'PY'
          from app.engine.builder import build_genome_output
          from app.engine.genome import Genome

          genome = Genome({
              "services": ["users", "orders"],
              "auth": "jwt",
              "database": "sqlite",
              "cors_enabled": True,
              "health_endpoints": True,
              "metrics_endpoints": True,
              "tracing_enabled": True,
              "rate_limiting": True,
              "timeout_config": {"request_timeout": 5.0},
              "cache_enabled": False,
              "circuit_breaker": True,
              "retry_policy": {"max_attempts": 3, "base_delay": 0.01, "max_delay": 0.05, "backoff_multiplier": 2},
              "backends": [],
              "middleware": [],
              "security_policies": [],
              "logging_level": "",
          })
          build_genome_output(genome, "output/ci-template-smoke")
          PY
      - name: Run Flake8 generated-template F821 guard
        working-directory: autonomous-api
        run: flake8 output/ci-template-smoke/ --count --select=F821 --show-source --statistics
      - name: Run Black check (non-blocking; repo has pre-existing formatting debt)
        working-directory: autonomous-api
        run: black app/ --check
        continue-on-error: true

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: autonomous-api/requirements.txt
      - name: Install dependencies
        working-directory: autonomous-api
        run: pip install -r requirements.txt
      - name: Install Bandit
        run: pip install bandit
      - name: Run Bandit
        working-directory: autonomous-api
        run: bandit -r app/ -ll

  build-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t autonomous-api-gen:ci autonomous-api
