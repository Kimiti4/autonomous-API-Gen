name: Compiler Source Quality

on:
  pull_request:
    branches: [main]
    paths:
      - "tiannara/application/compiler/**"
      - "tests/certification/test_compiler_source_quality.py"

jobs:
  source-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest
      - run: pytest -q tests/certification/test_compiler_source_quality.py
