name: Deployment Handoff Evidence Tests

on:
  pull_request:
    paths:
      - "tiannara/application/publication/deployment_handoff.py"
      - "tiannara/application/publication/uber_for_boats.py"
      - "tests/test_deployment_handoff_evidence.py"
      - ".github/workflows/deployment-handoff-focused.yml"
  push:
    branches:
      - "hardening/evidence-backed-deployment-handoff"
    paths:
      - "tiannara/application/publication/deployment_handoff.py"
      - "tiannara/application/publication/uber_for_boats.py"
      - "tests/test_deployment_handoff_evidence.py"
      - ".github/workflows/deployment-handoff-focused.yml"

permissions:
  contents: read

jobs:
  deployment-handoff-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run deployment evidence regression tests
        run: |
          python -m pytest -o addopts="" -q tests/test_deployment_handoff_evidence.py
