name: Identity Release Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: identity-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  identity-fast:
    name: Identity fast unit gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: autonomous-api/requirements*.txt
      - name: Install platform dependencies
        run: pip install -r autonomous-api/requirements.txt -r autonomous-api/requirements-dev.txt
      - name: Run identity unit gates
        run: pytest tests/identity -q

  identity-integration-evidence:
    name: Identity integration evidence chain (orchestrator)
    needs: identity-fast
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: autonomous-api/requirements*.txt
      - name: Install platform dependencies
        run: pip install -r autonomous-api/requirements.txt -r autonomous-api/requirements-dev.txt
      - name: Run identity integration orchestrator
        run: bash release/run-identity-gates.sh
      - name: Capture run id
        if: always()
        id: runid
        run: |
          if [ -f release/evidence/.latest-run-id ]; then
            echo "run_id=$(cat release/evidence/.latest-run-id)" >> "$GITHUB_OUTPUT"
          else
            echo "run_id=unknown" >> "$GITHUB_OUTPUT"
          fi
      - name: Archive evidence chain
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: identity-evidence-${{ steps.runid.outputs.run_id }}
          path: release/evidence/
          retention-days: 90
          if-no-files-found: error

  identity-certification:
    name: Identity certification (consume evidence)
    if: github.ref == 'refs/heads/main'
    needs: [identity-integration-evidence]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download integration evidence
        uses: actions/download-artifact@v4
        with:
          pattern: identity-evidence-*
          path: release/evidence-downloaded/
      - name: Verify identity certification manifest
        run: |
          set -euo pipefail
          agg="$(find release/evidence-downloaded -name aggregate.yaml -print -quit)"
          test -n "$agg" || { echo "FAIL: no aggregate.yaml" >&2; exit 1; }
          grep -q '^  verdict: CERTIFIED$' "$agg" || { echo "FAIL: verdict not CERTIFIED" >&2; exit 1; }
          grep -q '^  missing_evidence: \[\]$' "$agg" || { echo "FAIL: missing_evidence" >&2; exit 1; }
          grep -q '^  failed_gates: \[\]$' "$agg" || { echo "FAIL: failed_gates" >&2; exit 1; }
          echo "Identity certification verified"
