name: Ktor backend contract

on:
  pull_request:
    paths:
      - "tiannara/application/compiler/ktor_backend.py"
      - "tests/test_ktor_backend.py"
      - "tests/integration/test_generated_ktor_behavior.py"
      - ".github/workflows/ktor-backend-contract.yml"
  push:
    branches:
      - remediation/ktor-build-contract

jobs:
  generated-ktor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Install compiler dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run Ktor generator contract tests
        run: python -m pytest -q tests/test_ktor_backend.py
      - name: Build generated Ktor app, run tests, build container, and probe health
        run: python -m pytest -q tests/integration/test_generated_ktor_behavior.py
