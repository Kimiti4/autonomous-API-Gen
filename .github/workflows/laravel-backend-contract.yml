name: Laravel generated backend contract

on:
  pull_request:
    paths:
      - "tiannara/application/compiler/laravel_backend.py"
      - "tests/test_laravel_backend.py"
      - "tests/integration/test_generated_laravel_behavior.py"
      - ".github/workflows/laravel-backend-contract.yml"
  push:
    branches:
      - "remediation/laravel-runtime-contract"
    paths:
      - "tiannara/application/compiler/laravel_backend.py"
      - "tests/test_laravel_backend.py"
      - "tests/integration/test_generated_laravel_behavior.py"
      - ".github/workflows/laravel-backend-contract.yml"

permissions:
  contents: read

jobs:
  generated-laravel:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, dom, xml, xmlwriter
          tools: composer:v2
          coverage: none
      - name: Install compiler test dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pydantic fastapi
      - name: Run Laravel generator contract tests
        run: python -m pytest -q tests/test_laravel_backend.py
      - name: Install generated Laravel dependencies and verify runtime
        run: python -m pytest -q tests/integration/test_generated_laravel_behavior.py
