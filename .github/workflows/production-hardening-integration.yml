name: Production Hardening Integration
on:
  pull_request:
    paths:
      - "autonomous-api/app/engine/governed_pipeline.py"
      - "autonomous-api/app/engine/desktop_release.py"
      - "autonomous-api/app/marketplace/**"
      - "autonomous-api/tests/test_governed_pipeline.py"
      - "autonomous-api/tests/test_desktop_release.py"
      - "autonomous-api/tests/test_marketplace_*.py"
      - ".github/workflows/production-hardening-integration.yml"
  workflow_dispatch:
jobs:
  integration:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11","3.13"]
    defaults:
      run:
        working-directory: autonomous-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m pytest tests/test_governed_pipeline.py tests/test_desktop_release.py tests/test_marketplace_listing.py tests/test_marketplace_productization.py -q
