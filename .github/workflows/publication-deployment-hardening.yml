name: Publication and Deployment Hardening

on:
  push:
    branches:
      - "remediation/publication-deployment-gates"
    paths:
      - "autonomous-api/app/engine/backends.py"
      - "autonomous-api/app/engine/evolution.py"
      - "autonomous-api/app/engine/candidate_evaluator.py"
      - "autonomous-api/tests/test_a09_governed_promotion.py"
      - "autonomous-api/tests/engine/test_candidate_evaluator_governance_evidence.py"
      - "autonomous-api/tests/engine/test_backends.py"
      - "autonomous-api/tests/test_artifact_backup_restore.py"
      - "certification/campaign/campaign_b.py"
      - "certification/campaign/runner.py"
      - "compiler/api.py"
      - "compiler/security.py"
      - "compiler/validation.py"
      - "compiler/packaging.py"
      - "compiler/sdk/routes.py"
      - "compiler/governance/routes.py"
      - "tiannara/application/compiler/writer.py"
      - "tiannara/application/factory/factory.py"
      - "tiannara/application/materializer/**"
      - "tiannara/application/publication/**"
      - "tests/cbc1/test_campaign_b.py"
      - "tests/cbc1/test_cbc1_gates.py"
      - "tests/cbc1/test_candidate_bound_full_stack_gate.py"
      - "tests/test_compiler_runtime.py"
      - "tests/test_compiler_sdk.py"
      - "tests/test_compiler_packaging_security.py"
      - "tests/test_compiler_writer_path_security.py"
      - "tests/test_phase17_materializer_inmemory.py"
      - "tests/test_phase18_factory.py"
      - "tests/test_publication_contract_fail_closed.py"
      - "tests/test_secret_boundary.py"
      - ".github/workflows/publication-deployment-hardening.yml"
  pull_request:
    paths:
      - "autonomous-api/app/engine/backends.py"
      - "autonomous-api/tests/engine/test_backends.py"
      - "autonomous-api/tests/test_artifact_backup_restore.py"
      - "certification/campaign/campaign_b.py"
      - "certification/campaign/runner.py"
      - "compiler/api.py"
      - "compiler/security.py"
      - "compiler/validation.py"
      - "compiler/packaging.py"
      - "compiler/sdk/routes.py"
      - "compiler/governance/routes.py"
      - "tiannara/application/compiler/writer.py"
      - "tiannara/application/factory/factory.py"
      - "tiannara/application/materializer/**"
      - "tiannara/application/publication/**"
      - "tests/cbc1/test_campaign_b.py"
      - "tests/cbc1/test_cbc1_gates.py"
      - "tests/cbc1/test_candidate_bound_full_stack_gate.py"
      - "tests/test_compiler_runtime.py"
      - "tests/test_compiler_sdk.py"
      - "tests/test_compiler_packaging_security.py"
      - "tests/test_compiler_writer_path_security.py"
      - "tests/test_phase17_materializer_inmemory.py"
      - "tests/test_phase18_factory.py"
      - "tests/test_publication_contract_fail_closed.py"
      - "tests/test_secret_boundary.py"
      - ".github/workflows/publication-deployment-hardening.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publication-deployment-hardening-${{ github.ref }}
  cancel-in-progress: true

jobs:
  targeted-hardening:
    name: Targeted publication, materialization and campaign gates
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            autonomous-api/requirements.txt
            autonomous-api/requirements-dev.txt

      - name: Install root and platform test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install -r autonomous-api/requirements.txt -r autonomous-api/requirements-dev.txt
          pip install pytest-xdist pytest-asyncio pyyaml pydantic-settings hypothesis

      - name: Compile changed Python modules
        run: |
          python -m compileall -q \
            autonomous-api/app/engine/backends.py \
            autonomous-api/app/engine/evolution.py \
            autonomous-api/app/engine/candidate_evaluator.py \
            autonomous-api/tests/test_a09_governed_promotion.py \
            autonomous-api/tests/engine/test_candidate_evaluator_governance_evidence.py \
            autonomous-api/tests/engine/test_backends.py \
            autonomous-api/tests/test_artifact_backup_restore.py \
            certification/campaign/campaign_b.py \
            certification/campaign/runner.py \
            compiler/api.py compiler/security.py compiler/validation.py compiler/packaging.py \
            compiler/sdk/routes.py compiler/governance/routes.py \
            tiannara/application/compiler/writer.py \
            tiannara/application/factory/factory.py \
            tiannara/application/materializer \
            tiannara/application/publication \
            autonomous-api/tests/engine/test_backends.py \
            autonomous-api/tests/test_artifact_backup_restore.py \
            tests/cbc1/test_campaign_b.py \
            tests/cbc1/test_cbc1_gates.py \
            tests/test_compiler_runtime.py tests/test_compiler_sdk.py \
            tests/test_compiler_packaging_security.py \
            tests/test_compiler_writer_path_security.py \
            tests/test_phase17_materializer_inmemory.py \
            tests/test_phase18_factory.py \
            tests/test_publication_contract_fail_closed.py \
            tests/test_secret_boundary.py

      - name: Run root ESAP regression tests
        env:
          PYTHONPATH: autonomous-api
        run: |
          python -m pytest -q \
            tests/cbc1/test_campaign_b.py \
            tests/cbc1/test_cbc1_gates.py \
            tests/cbc1/test_candidate_bound_full_stack_gate.py \
            tests/test_compiler_runtime.py tests/test_compiler_sdk.py \
            tests/test_compiler_packaging_security.py \
            tests/test_compiler_writer_path_security.py \
            tests/test_phase17_materializer_inmemory.py \
            tests/test_phase18_factory.py \
            tests/test_publication_contract_fail_closed.py \
            tests/test_secret_boundary.py

      - name: Run autonomous-api evolution regression tests
        working-directory: autonomous-api
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -q \
            tests/engine/test_backends.py \
            tests/test_artifact_backup_restore.py \
            tests/test_a09_governed_promotion.py \
            tests/engine/test_candidate_evaluator_governance_evidence.py
