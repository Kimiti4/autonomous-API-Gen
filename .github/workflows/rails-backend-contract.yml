name: Rails generated backend contract

on:
  pull_request:
    paths:
      - "tiannara/application/compiler/rails_backend.py"
      - "tests/test_rails_backend.py"
      - "tests/integration/test_generated_rails_behavior.py"
      - ".github/workflows/rails-backend-contract.yml"
  push:
    branches:
      - "remediation/rails-runtime-contract"
    paths:
      - "tiannara/application/compiler/rails_backend.py"
      - "tests/test_rails_backend.py"
      - "tests/integration/test_generated_rails_behavior.py"
      - ".github/workflows/rails-backend-contract.yml"

permissions:
  contents: read

jobs:
  generated-rails:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - name: Install compiler test dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pydantic fastapi
      - name: Run Rails generator contract tests
        run: python -m pytest -q tests/test_rails_backend.py
      - name: Install generated Rails dependencies and verify runtime
        run: python -m pytest -q tests/integration/test_generated_rails_behavior.py
