name: Root Canonical Suite

# Tier A canonical gate — the project's authoritative regression suite.
#
# Runs the full unit/contract suite under tests/ (~4538 tests) exactly as
# configured by pyproject [tool.pytest.ini_options]:
#   - testpaths = ["tests"]
#   - --import-mode=importlib (avoids */tests/ package-name collisions)
#   - -m "not docker_integration and not certification" (Tier A only)
#
# Historically this suite only ran locally — CI's "green" signals covered
# other scopes (final-13, ci-cd, release gates), which is how 116 local
# failures once coexisted with a green CI. This workflow closes that gap.
#
# No path filters: a required check must always report a conclusion.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonical:
    name: pytest tests/ (Tier A)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Canonical interpreter for this suite (AGENTS.md: Python 3.14).
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pytest-xdist pytest-asyncio pyyaml pydantic-settings hypothesis
          # tests/vs1/test_deployment.py asserts installed versions against
          # vertical_slice/deployment.py DEPENDENCY_VERSIONS (VS-D05 pins:
          # fastapi 0.136.0, uvicorn 0.45.0, pydantic 2.13.0); the open-ended
          # >= bounds in pyproject would otherwise drift to newer releases.
          pip install "fastapi==0.136.0" "uvicorn==0.45.0" "pydantic==2.13.0"

      - name: Run the canonical suite
        run: python -m pytest -q -n auto
