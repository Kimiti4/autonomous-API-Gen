name: Rust Axum ISR Parity Gate

on:
  push:
    branches: [main, "remediation/**", "feat/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: rust-axum-parity-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust-axum-parity:
    name: Rust Axum / Shared ISR Payroll API Parity Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: autonomous-api/requirements*.txt

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Elixir and Erlang
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18"
          otp-version: "28"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest fastapi httpx starlette uvicorn

      - name: Record toolchain and environment metadata
        run: |
          echo "=== Parity Gate Pre-Flight Environment Metadata ==="
          echo "Commit SHA: ${{ github.sha }}"
          echo "Runner OS: $(uname -s) $(uname -r) $(uname -m)"
          cat /etc/os-release | grep -E "^(NAME|VERSION)=" || true
          rustc --version
          cargo --version
          elixir --version || true
          python --version
          echo "==================================================="

      - name: Execute live cross-backend ISR parity gate (Rust Axum, Elixir OTP, Python FastAPI)
        run: |
          python -m pytest tests/integration/test_isr_api_parity.py -v --tb=short


      - name: Archive execution logs and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-axum-parity-evidence
          path: |
            **/parity.log
            **/parity.port
          retention-days: 90
