name: TaskFlow Native Adapter
on:
  pull_request:
    paths:
      - ".github/workflows/taskflow-native-adapter.yml"
      - "tiannara/domain/models/semantic_resolution.py"
      - "tiannara/domain/models/taskflow_semantic_contract.py"
      - "tests/test_taskflow_semantic_contract.py"
      - "tiannara/application/intent/compiler.py"
      - "tiannara/application/intent/schemas.py"
      - "tiannara/application/compiler/project_compiler.py"
      - "tests/test_intent_compiler.py"
      - "tests/test_taskflow_semantic_projection.py"
      - "tests/test_project_compiler_semantic_gate.py"
      - "experiments/taskflow-native/provider_free/typed_isr_gate.py"
      - "experiments/taskflow-native/provider_free/taskflow_semantic_contract.py"
      - "experiments/taskflow-native/tests/test_typed_isr_semantic_gate.py"
      - "tests/test_semantic_resolution_gate.py"
      - "experiments/taskflow-native/provider_free/native_adapter.py"
      - "experiments/taskflow-native/provider_free/run_trial.py"
      - "experiments/taskflow-native/provider_free/semantic_source_audit.py"
      - "experiments/taskflow-native/provider_free/trusted_evidence.py"
      - "tests/test_taskflow_semantic_source_audit.py"
      - "tests/test_taskflow_trusted_evidence.py"
      - "tests/test_taskflow_native_trial_runner.py"
      - "tiannara/domain/models/requirement_graph.py"
      - "tiannara/domain/models/system_model.py"
      - "tiannara/domain/services/canonical.py"
      - "tests/test_taskflow_native_adapter.py"
      - "experiments/taskflow-native/PROBLEM.md"
      - "experiments/taskflow-native/decision_coverage_matrix.v1.json"
      - "experiments/taskflow-native/validate_decision_ledger.py"
      - "docs/evidence/taskflow_review/**"
      - "docs/evidence/TASKFLOW_GROUPS_1_14_RECONCILIATION_AUDIT.md"
      - "docs/evidence/TASKFLOW_SEMANTIC_CONSUMER_TRACE_AUDIT.md"
      - "tests/test_taskflow_decision_ledger_validation.py"
      - "golden-projects/taskflow/ACCEPTANCE.json"
      - "experiments/compiler-benchmarks/taskflow_input_parity.py"
      - "experiments/compiler-benchmarks/tests/test_taskflow_input_parity.py"
      - "experiments/compiler-benchmarks/benchmark_manifest.template.json"
      - "experiments/compiler-benchmarks/coherence_suite.v1.json"
      - "experiments/compiler-benchmarks/tests/test_coherence_suite.py"
      - "constitutional_architecture/compiler/passes/validation_pass.py"
      - "tests/test_constitutional_compiler_validation_pass.py"
  workflow_dispatch:

# The focused suite covers TaskFlow fail-closed gates and the ten-domain coherence contract.
permissions:
  contents: read

jobs:
  native-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused test dependencies
        run: python -m pip install "pydantic>=2,<3" pytest
      - name: Validate reviewer ledger, source hashes, coverage, and fail-closed authorization
        run: python experiments/taskflow-native/validate_decision_ledger.py
      - name: Verify deterministic native graph and fail-closed generation gate
        run: PYTHONPATH=.:experiments/taskflow-native:experiments/taskflow-native/provider_free:$PYTHONPATH python -m pytest tests/test_taskflow_decision_ledger_validation.py tests/test_taskflow_native_adapter.py tests/test_taskflow_native_trial_runner.py tests/test_taskflow_semantic_source_audit.py tests/test_taskflow_trusted_evidence.py tests/test_semantic_resolution_gate.py tests/test_intent_compiler.py tests/test_taskflow_semantic_projection.py tests/test_project_compiler_semantic_gate.py experiments/taskflow-native/tests/test_typed_isr_semantic_gate.py experiments/compiler-benchmarks/tests/test_taskflow_input_parity.py tests/test_constitutional_compiler_validation_pass.py tests/test_taskflow_semantic_contract.py experiments/compiler-benchmarks/tests/test_coherence_suite.py -q