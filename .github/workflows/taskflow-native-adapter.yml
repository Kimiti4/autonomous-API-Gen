name: TaskFlow Native Adapter
on:
  pull_request:
    paths:
      - ".github/workflows/taskflow-native-adapter.yml"
      - "tiannara/domain/models/semantic_resolution.py"
      - "tiannara/application/intent/compiler.py"
      - "tiannara/application/intent/schemas.py"
      - "tiannara/application/compiler/project_compiler.py"
      - "tests/test_intent_compiler.py"
      - "tests/test_project_compiler_semantic_gate.py"
      - "experiments/taskflow-native/provider_free/typed_isr_gate.py"
      - "experiments/taskflow-native/provider_free/taskflow_semantic_contract.py"
      - "experiments/taskflow-native/tests/test_typed_isr_semantic_gate.py"
      - "tests/test_semantic_resolution_gate.py"
      - "experiments/taskflow-native/provider_free/native_adapter.py"
      - "experiments/taskflow-native/provider_free/run_trial.py"
      - "tests/test_taskflow_native_trial_runner.py"
      - "tiannara/domain/models/requirement_graph.py"
      - "tiannara/domain/models/system_model.py"
      - "tiannara/domain/services/canonical.py"
      - "tests/test_taskflow_native_adapter.py"
      - "experiments/taskflow-native/PROBLEM.md"
      - "golden-projects/taskflow/ACCEPTANCE.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused test dependencies
        run: python -m pip install "pydantic>=2,<3" pytest
      - name: Verify deterministic native graph and fail-closed generation gate
        run: PYTHONPATH=.:experiments/taskflow-native:experiments/taskflow-native/provider_free:$PYTHONPATH python -m pytest tests/test_taskflow_native_adapter.py tests/test_taskflow_native_trial_runner.py tests/test_semantic_resolution_gate.py tests/test_intent_compiler.py tests/test_project_compiler_semantic_gate.py experiments/taskflow-native/tests/test_typed_isr_semantic_gate.py -q
