name: TaskFlow Native Trial

on:
  workflow_dispatch:
  push:
    branches: [main, bucket-4-1-complete-existing-codebase-capability, hardening/taskflow-generalization-integrity-gate]
    paths:
      - 'experiments/taskflow-native/**'
      - 'tiannara/**'
      - 'golden-projects/taskflow/ACCEPTANCE.json'
      - '.github/workflows/taskflow-native.yml'
  pull_request:
    branches: [main, bucket-4-1-complete-existing-codebase-capability]
    paths:
      - 'experiments/taskflow-native/**'
      - 'tiannara/**'
      - 'golden-projects/taskflow/ACCEPTANCE.json'
      - '.github/workflows/taskflow-native.yml'

concurrency:
  group: taskflow-native-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  trial:
    name: TASKFLOW-ESAP-NATIVE-001 blind-generation trial
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install trial dependencies
        run: |
          python -m pip install -q fastapi "uvicorn[standard]" pytest httpx
          curl -fsSL https://ollama.com/install.sh | sh
      - name: Start local model runtime
        env:
          TASKFLOW_OLLAMA_MODEL: qwen2.5:3b
        run: |
          ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:11434/api/tags >/dev/null; then
              break
            fi
            sleep 2
          done
          curl --fail http://127.0.0.1:11434/api/tags >/dev/null
          ollama pull "$TASKFLOW_OLLAMA_MODEL"
      - name: Remove forbidden golden inputs and repository metadata
        run: |
          rm -rf .git golden-projects/taskflow/app golden-projects/taskflow/ARCHITECTURE.md
          test ! -e .git
          test ! -e golden-projects/taskflow/app
          test ! -e golden-projects/taskflow/ARCHITECTURE.md
      - name: Run blind-generation trial
        env:
          TASKFLOW_OLLAMA_MODEL: qwen2.5:3b
          TASKFLOW_OLLAMA_URL: http://127.0.0.1:11434
          TASKFLOW_OLLAMA_TIMEOUT_SECONDS: "600"
        run: python experiments/taskflow-native/run_trial.py
      - name: Evaluate trial evidence (release gate)
        if: always()
        run: python experiments/taskflow-native/evaluate.py
      - name: Evaluate generalization and blind-input integrity
        if: always()
        run: python experiments/taskflow-native/check_generalization_integrity.py
      - name: Archive trial evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: taskflow-native-evidence-${{ github.sha }}
          path: |
            experiments/taskflow-native/out/evidence/
            experiments/taskflow-native/out/repo/verification-*.log
          retention-days: 90
          if-no-files-found: warn
