name: TaskFlow Native Trial

on:
  workflow_dispatch:
  push:
    branches: [main, bucket-4-1-complete-existing-codebase-capability]
    paths:
      - 'experiments/taskflow-native/**'
      - 'experiments/spec2-expensel/**'
      - 'tiannara/**'
      - 'golden-projects/taskflow/ACCEPTANCE.json'
      - '.github/workflows/taskflow-native.yml'
  pull_request:
    branches: [main]
    paths:
      - 'experiments/taskflow-native/**'
      - 'experiments/spec2-expensel/**'
      - 'tiannara/**'
      - 'golden-projects/taskflow/ACCEPTANCE.json'
      - '.github/workflows/taskflow-native.yml'

concurrency:
  group: taskflow-native-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  trial:
    name: Blind-generation trials (TaskFlow + ExpenseLedger) with integrity gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install trial dependencies
        run: python -m pip install -q fastapi "uvicorn[standard]" pytest httpx
      - name: Run first blind-generation trial (TaskFlow)
        run: python experiments/taskflow-native/run_trial.py
      - name: Run second blind-generation trial (ExpenseLedger)
        if: always()
        run: python experiments/taskflow-native/run_trial.py --trial-dir experiments/spec2-expensel
      - name: Evaluate first trial evidence (release gate)
        if: always()
        run: python experiments/taskflow-native/evaluate.py
      - name: Evaluate second trial evidence (release gate)
        if: always()
        run: python experiments/taskflow-native/evaluate.py --trial-dir experiments/spec2-expensel
      - name: Generalization integrity gate (PASS/FAIL/BLOCKED)
        if: always()
        run: python experiments/taskflow-native/check_generalization_integrity.py
      - name: Archive trial evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: taskflow-native-evidence-${{ github.sha }}
          path: |
            experiments/taskflow-native/out/evidence/
            experiments/taskflow-native/out/repo/verification-*.log
            experiments/spec2-expensel/out/evidence/
            experiments/spec2-expensel/out/repo/verification-*.log
          retention-days: 90
          if-no-files-found: warn
