name: TaskFlow Provider-Free Checks

on:
  pull_request:
    paths:
      - ".github/workflows/taskflow-provider-free-tests.yml"
      - "experiments/taskflow-native/provider_free/**"
      - "experiments/taskflow-native/tests/test_provider_free_*.py"
      - "experiments/taskflow-native/input_snapshot.py"
      - "experiments/taskflow-native/TRIAL_CONTRACT.json"
      - "experiments/taskflow-native/PROBLEM.md"
      - "golden-projects/taskflow/ACCEPTANCE.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provider-free:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Capture canonical TaskFlow inputs into an immutable snapshot
        run: |
          python experiments/taskflow-native/input_snapshot.py \
            --trial-dir "$GITHUB_WORKSPACE" \
            --evidence-dir experiments/taskflow-native/out/provider-free-evidence
      - name: Verify snapshot integrity before analysis
        run: |
          python experiments/taskflow-native/input_snapshot.py \
            --trial-dir "$GITHUB_WORKSPACE" \
            --evidence-dir experiments/taskflow-native/out/provider-free-evidence \
            --verify
      - name: Run offline provider-free acceptance analysis tests
        run: |
          python -m unittest discover \
            -s experiments/taskflow-native/tests \
            -p 'test_*.py' \
            -v
      - name: Analyze only the snapshotted acceptance contract
        run: |
          python -m provider_free.cli \
            --acceptance out/provider-free-evidence/inputs/golden-projects/taskflow/ACCEPTANCE.json \
            --output out/provider-free-evidence/provider-free-analysis.json
        working-directory: experiments/taskflow-native
      - name: Build deterministic partial ISR from snapshot only
        run: |
          python -m provider_free.isr_profile \
            --problem out/provider-free-evidence/inputs/experiments/taskflow-native/PROBLEM.md \
            --acceptance out/provider-free-evidence/inputs/golden-projects/taskflow/ACCEPTANCE.json \
            --output out/provider-free-evidence/taskflow-isr-profile.json
          python -c "import json; p=json.load(open('out/provider-free-evidence/taskflow-isr-profile.json', encoding='utf-8')); assert p['certified'] is False; assert p['generation_allowed'] is False; assert p['network_calls'] == 0; assert len(p['traceability']['capabilities']) == 11; print('partial ISR profile emitted; generation correctly blocked')"
        working-directory: experiments/taskflow-native
      - name: Verify snapshot integrity remains intact after analysis
        run: |
          python experiments/taskflow-native/input_snapshot.py \
            --trial-dir "$GITHUB_WORKSPACE" \
            --evidence-dir experiments/taskflow-native/out/provider-free-evidence \
            --verify
