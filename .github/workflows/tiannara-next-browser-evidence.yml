name: Tiannara Next.js Browser Evidence

# W13 requires generated frontend packages to install, compile, run and pass
# browser-level tests. This job generates the tiannara Next.js bundle and runs its
# Playwright suite in Chromium so the evidence is reproducible off a developer
# machine. It does not claim routes, forms, API clients or auth. Next.js has its
# own emitted behaviour; nothing here is copied from React, Vue or Angular.

on:
  pull_request:
    paths:
      - "tiannara/application/compiler/next_frontend.py"
      - "tiannara/domain/models/system_model.py"
      - "scripts/tiannara_next_fixture.py"
      - "tests/test_tiannara_next_browser_evidence.py"
      - ".github/workflows/tiannara-next-browser-evidence.yml"
  push:
    branches: [main]
    paths:
      - "tiannara/application/compiler/next_frontend.py"
      - "tiannara/domain/models/system_model.py"
      - "scripts/tiannara_next_fixture.py"
      - ".github/workflows/tiannara-next-browser-evidence.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  FIXTURE_DIR: tiannara-next-fixture

jobs:
  generated-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Python test dependencies
        run: python -m pip install "pydantic>=2.7,<3" pytest
      - name: Assert the emitted bundle and browser test
        run: python -m pytest tests/test_tiannara_next_browser_evidence.py -q
      - name: Generate the frontend bundle
        run: python scripts/tiannara_next_fixture.py "${{ env.FIXTURE_DIR }}" "Payment,Invoice"
      - name: Install generated dependencies
        working-directory: ${{ env.FIXTURE_DIR }}
        run: npm install --no-audit --no-fund
      - name: Production build
        working-directory: ${{ env.FIXTURE_DIR }}
        run: npm run build
      - name: Unit tests
        working-directory: ${{ env.FIXTURE_DIR }}
        run: npm test
      - name: Install Chromium
        working-directory: ${{ env.FIXTURE_DIR }}
        run: npx playwright install --with-deps chromium
      - name: Browser test
        working-directory: ${{ env.FIXTURE_DIR }}
        run: npm run test:e2e
      - name: Break the generated filter (negative control)
        run: python scripts/tiannara_next_fixture.py "${{ env.FIXTURE_DIR }}" --negative-control
      - name: Browser test must reject the broken bundle
        working-directory: ${{ env.FIXTURE_DIR }}
        shell: bash
        run: |
          if npm run test:e2e; then
            echo "negative control passed a deliberately broken application" >&2
            exit 1
          else
            echo "browser suite rejected the deliberately broken application, as required"
          fi
      - name: Regenerate with overlapping names
        run: python scripts/tiannara_next_fixture.py "${{ env.FIXTURE_DIR }}" "Pay,Payment"
      - name: Browser test (overlapping names)
        working-directory: ${{ env.FIXTURE_DIR }}
        run: npm run test:e2e
      - name: Regenerate with empty model list
        run: python scripts/tiannara_next_fixture.py "${{ env.FIXTURE_DIR }}" ""
      - name: Browser test (empty model list)
        working-directory: ${{ env.FIXTURE_DIR }}
        run: npm run test:e2e
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tiannara-next-browser-results
          path: ${{ env.FIXTURE_DIR }}/test-results
          if-no-files-found: ignore
