name: v1.3 Release Gate

on:
  push:
    branches: [main]
    tags: ['v1.3.*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: v1.3-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ------------------------------------------------------------------
  # Fast fail-closed pre-gate: pure v1.3 unit gates (no Postgres).
  # ------------------------------------------------------------------
  v13-fast:
    name: v1.3 fast unit gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: autonomous-api/requirements*.txt
      - name: Install platform dependencies
        run: pip install -r autonomous-api/requirements.txt -r autonomous-api/requirements-dev.txt
      - name: Run pure v1.3 gates (E1-E7, E9-E10)
        run: pytest tests/v13 -q

  # ------------------------------------------------------------------
  # Integration evidence chain: runs the 12-gate orchestrator (E0-E11),
  # archives the evidence chain even on failure.
  # ------------------------------------------------------------------
  v13-integration-evidence:
    name: v1.3 integration evidence chain (orchestrator)
    needs: v13-fast
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: autonomous-api/requirements*.txt
      - name: Install platform dependencies
        run: pip install -r autonomous-api/requirements.txt -r autonomous-api/requirements-dev.txt
      - name: Run v1.3 integration orchestrator
        run: bash release/run-v1.3-gates.sh
      - name: Capture run id
        if: always()
        id: runid
        run: |
          if [ -f release/evidence/.latest-run-id ]; then
            echo "run_id=$(cat release/evidence/.latest-run-id)" >> "$GITHUB_OUTPUT"
          else
            echo "run_id=unknown" >> "$GITHUB_OUTPUT"
          fi
      - name: Archive evidence chain
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v1.3-evidence-${{ steps.runid.outputs.run_id }}
          path: release/evidence/
          retention-days: 90
          if-no-files-found: error

  # ------------------------------------------------------------------
  # Authoritative certification: consumes the archived evidence manifest,
  # verifies verdict + empty failure sets + per-gate evidence hash chain.
  # ------------------------------------------------------------------
  v13-certification:
    name: v1.3 certification (consume evidence)
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v1.3.')
    needs: [v13-integration-evidence]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download integration evidence
        uses: actions/download-artifact@v4
        with:
          pattern: v1.3-evidence-*
          path: release/evidence-downloaded/
      - name: Verify v1.3 certification manifest
        run: |
          set -euo pipefail
          agg="$(find release/evidence-downloaded -name aggregate.yaml -print -quit)"
          test -n "$agg" || { echo "FAIL: no aggregate.yaml in evidence chain" >&2; exit 1; }
          grep -q '^  verdict: CERTIFIED$' "$agg"     || { echo "FAIL: verdict not CERTIFIED" >&2; cat "$agg" >&2; exit 1; }
          grep -q '^  missing_evidence: \[\]$' "$agg" || { echo "FAIL: missing_evidence non-empty" >&2; exit 1; }
          grep -q '^  failed_gates: \[\]$' "$agg"     || { echo "FAIL: failed_gates non-empty" >&2; exit 1; }

          dir="$(dirname "$agg")"
          python3 - "$dir" <<'PY'
          import hashlib, os, re, sys
          d = sys.argv[1]; agg = os.path.join(d, "aggregate.yaml")
          in_gates = False; cur = None; bad = []
          for line in open(agg):
              if line.rstrip() == "gates:":         in_gates = True;  continue
              if line.rstrip() == "certification:": in_gates = False; continue
              if in_gates:
                  m = re.match(r"^  (\S+):$", line)
                  if m: cur = m.group(1); continue
                  m = re.match(r"^    evidence_sha256: (\S+)$", line)
                  if m and cur:
                      want = m.group(1); ev = os.path.join(d, cur, "evidence.yaml")
                      if want == "null" or not os.path.exists(ev):
                          bad.append(f"{cur}:missing"); continue
                      got = hashlib.sha256(open(ev, "rb").read()).hexdigest()
                      if got != want: bad.append(f"{cur}:hash-mismatch")
          if bad:
              print("FAIL: evidence chain broken:", bad, file=sys.stderr); sys.exit(1)
          print("v1.3 certification manifest verified (verdict + empty failures + evidence hash chain)")
          PY
