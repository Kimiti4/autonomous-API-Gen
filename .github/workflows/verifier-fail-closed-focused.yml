name: Verifier Fail-Closed Focused Tests

on:
  pull_request:
    paths:
      - "constitutional_architecture/compiler/pass_manager.py"
      - "constitutional_architecture/compiler/passes/verification_pass.py"
      - "constitutional_architecture/compiler/quality/diagnostics.py"
      - "tests/test_verification_pass_fail_closed.py"
      - ".github/workflows/verifier-fail-closed-focused.yml"
  push:
    branches:
      - "hardening/verifier-fail-closed-mainline"
    paths:
      - "constitutional_architecture/compiler/pass_manager.py"
      - "constitutional_architecture/compiler/passes/verification_pass.py"
      - "constitutional_architecture/compiler/quality/diagnostics.py"
      - "tests/test_verification_pass_fail_closed.py"
      - ".github/workflows/verifier-fail-closed-focused.yml"

permissions:
  contents: read

jobs:
  focused-verifier-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run focused fail-closed regression tests
        run: |
          python -m pytest -o addopts="" -q tests/test_verification_pass_fail_closed.py
