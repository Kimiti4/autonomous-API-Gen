[project]
name = "autonomous-api"
version = "0.1.0"
description = "Autonomous Evolution Engine - Genetic API Architecture Generator with multi-agent reasoning"
readme = "README.md"
requires-python = ">=3.11, <3.14.1"
dependencies = [
    "aiosqlite>=0.22.1",
    "astor>=0.8.1",
    "asyncpg>=0.29.0",
    "fastapi>=0.135.3",
    "httpx>=0.28.1",
    "imagekitio>=5.3.0",
    "loguru>=0.7.3",
    "networkx>=3.6.1",
    "numpy>=2.4.4",
    "ollama>=0.6.1",
    "openai>=2.30.0",
    "psutil>=5.9.0",
    "PyJWT>=2.10.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.2.2",
    "sqlalchemy[asyncio]>=2.0.0",
    "sse-starlette>=3.3.4",
    "uvicorn>=0.44.0",
    "websockets>=12.0",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "prometheus-fastapi-instrumentator>=6.1.0",
]

[project.optional-dependencies]
# Manual load-testing CLI only (load_test.py: `locust -f load_test.py`);
# not imported by the application, so not a runtime dependency.
load = [
    "locust>=2.20.0",
]

[project.scripts]
autonomous-api = "autonomous_api:main"

[dependency-groups]
# Mirrors requirements-dev.txt so every requirements*.txt line is covered by
# uv.lock and CI can constrain installs against it.
dev = [
    "pytest-cov>=5.0.0",
    "mypy>=1.11.0",
]

[tool.pytest.ini_options]
# Pins rootdir to autonomous-api when pytest runs inside it: `import app.*`
# resolves via "." instead of the workspace-root pyproject's pythonpath.
pythonpath = ["."]
markers = [
    "integration: requires live infrastructure (Postgres via tests/integration/docker-compose.yml)",
]

[build-system]
requires = ["uv_build>=0.11.3,<0.12.0"]
build-backend = "uv_build"
