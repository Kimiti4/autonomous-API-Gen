# Stratification taxonomy v0.1 -- calibration slice.
# Axes of variation are authored here; project instances are generated by
# the seeded sampler. Widening this taxonomy is a data change (new version),
# never a code change. Constraint set is reviewed per taxonomy version.

taxonomy_version: "0.1.0"

axes:
  domain:
    - business_operations
    - financial_services
    - healthcare_delivery
    - logistics_coordination
    - media_streaming
  complexity_tier: [simple, medium, complex]
  capability_class: [transactional, analytical, real_time, hybrid]
  scale_tier: [small, medium, large]
  integration_pattern: [none, request_response, event_driven]
  compliance_regime: [none, data_privacy, payment]

profiles:
  domains:
    business_operations:
      capabilities: [case_management, scheduling, reporting]
      data_entities: [case, schedule_entry, report]
      quality_focus: [auditability, usability]
    financial_services:
      capabilities: [account_management, payment_processing, ledger_reconciliation]
      data_entities: [account, transaction, ledger_entry]
      quality_focus: [consistency, auditability]
    healthcare_delivery:
      capabilities: [patient_intake, care_coordination, records_management]
      data_entities: [patient, care_plan, clinical_record]
      quality_focus: [confidentiality, availability]
    logistics_coordination:
      capabilities: [shipment_tracking, route_planning, carrier_management]
      data_entities: [shipment, route, carrier]
      quality_focus: [traceability, timeliness]
    media_streaming:
      capabilities: [content_catalog, playback_session, recommendation]
      data_entities: [catalog_item, playback_session, preference_profile]
      quality_focus: [availability, latency]

  complexity_tiers:
    simple:
      expected_requirement_range: [8, 14]
      extra_topics: [basic_reporting]
    medium:
      expected_requirement_range: [15, 28]
      extra_topics: [basic_reporting, configuration_management]
    complex:
      expected_requirement_range: [29, 60]
      extra_topics: [basic_reporting, configuration_management, multi_party_workflows]

  capability_classes:
    transactional:
      primary_interaction: synchronous_request_response
      topics: [transactional_integrity]
    analytical:
      primary_interaction: asynchronous_batch
      topics: [historical_analysis]
    real_time:
      primary_interaction: streaming
      topics: [low_latency_processing]
    hybrid:
      primary_interaction: mixed_interaction
      topics: [transactional_integrity, historical_analysis]

  scale_tiers:
    small:
      expected_services: 1
      throughput_class: low
      availability_posture: single_zone
    medium:
      expected_services: 3
      throughput_class: moderate
      availability_posture: multi_zone
    large:
      expected_services: 6
      throughput_class: high
      availability_posture: multi_region

  integration_patterns:
    none:
      topics: []
    request_response:
      topics: [external_api_consumption, api_contract_stability]
    event_driven:
      topics: [event_interchange, delivery_semantics_agreement]

  compliance_regimes:
    none:
      topics: []
    data_privacy:
      topics: [consent_management, data_retention_limits, subject_access_rights]
    payment:
      topics: [cardholder_data_protection, segregation_of_payment_processing]

constraints:
  # Real-time capability classes require some integration posture.
  - forbidden:
      integration_pattern: none
      capability_class: real_time
