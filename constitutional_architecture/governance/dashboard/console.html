<style>
  :root { --ink:#1c2733; --muted:#5c6b7a; --line:#d7dee5; --bg:#f5f7f9; --card:#fff;
          --allow:#e6f4ea; --allow-ink:#1e7e34; --deny:#fdecea; --deny-ink:#b3261e;
          --approval:#fff4e5; --approval-ink:#b26a00; --evidence:#eef2ff; --evidence-ink:#3d5afe; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Segoe UI", system-ui, sans-serif; color:var(--ink); background:var(--bg); }
  header { background:#14202b; color:#e8eef4; padding:14px 22px; }
  header h1 { margin:0; font-size:18px; letter-spacing:.4px; }
  header p { margin:2px 0 0; color:#93a5b5; font-size:12px; }
  nav { display:flex; gap:2px; background:#0f1922; padding:0 14px; }
  nav button { background:none; border:none; color:#b7c4d0; padding:10px 14px; cursor:pointer;
               font-size:13px; border-bottom:2px solid transparent; }
  nav button.active { color:#fff; border-bottom-color:#4c9aff; }
  main { padding:18px 22px; max-width:1400px; }
  section.tab { display:none; }
  section.tab.active { display:block; }
  h2 { font-size:15px; margin:0 0 10px; }
  .cards { display:grid; grid-template-columns:repeat(auto-fit, minmax(150px,1fr)); gap:10px; margin-bottom:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:6px; padding:12px; }
  .card .label { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; }
  .card .value { font-size:22px; font-weight:600; margin-top:4px; }
  table { border-collapse:collapse; width:100%; background:var(--card); font-size:12.5px; }
  th, td { border:1px solid var(--line); padding:6px 9px; text-align:left; vertical-align:top; }
  th { background:#eef2f5; font-size:11.5px; text-transform:uppercase; letter-spacing:.4px; color:#42505d; }
  code, pre, .mono { font-family:Consolas, "Cascadia Mono", monospace; font-size:12px; }
  pre { background:#0f1922; color:#d7e3ee; padding:12px; border-radius:6px; overflow:auto; max-height:480px; }
  .badge { display:inline-block; padding:1px 8px; border-radius:10px; font-size:11px; font-weight:600; }
  .b-ALLOW, .b-APPROVED { background:var(--allow); color:var(--allow-ink); }
  .b-DENY, .b-REJECTED { background:var(--deny); color:var(--deny-ink); }
  .b-REQUIRE_APPROVAL, .b-PENDING, .b-EXPIRED { background:var(--approval); color:var(--approval-ink); }
  .b-REQUIRE_EVIDENCE { background:var(--evidence); color:var(--evidence-ink); }
  .b-ACTIVE, .b-VALID { background:var(--allow); color:var(--allow-ink); }
  .b-REVOKED, .b-BROKEN { background:var(--deny); color:var(--deny-ink); }
  .filters { margin-bottom:10px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .filters input, .filters select { padding:5px 8px; border:1px solid var(--line); border-radius:4px; font-size:12.5px; }
  .filters label { font-size:12px; color:var(--muted); }
  button.action { background:#14202b; color:#fff; border:none; border-radius:4px; padding:6px 12px; cursor:pointer; font-size:12.5px; }
  .note { color:var(--muted); font-size:12px; }
  .muted { color:var(--muted); }
  td.decision_id { font-family:Consolas, monospace; font-size:11.5px; }
</style>
</head>

function el(tag, cls, text) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined && text !== null) e.textContent = text;
  return e;
}

function badge(value) {
  var b = el("span", "badge b-" + String(value).toUpperCase());
  b.textContent = value;
  return b;
}

function table(headers, rows) {
  var t = el("table");
  var thead = el("thead"), tr = el("tr");
  headers.forEach(function (h) { tr.appendChild(el("th", null, h)); });
  thead.appendChild(tr); t.appendChild(thead);
  var tb = el("tbody");
  rows.forEach(function (r) {
    var row = el("tr");
    r.forEach(function (cell) {
      var td = el("td");
      if (cell && cell.nodeType === 1) td.appendChild(cell); else td.textContent = cell === undefined ? "" : cell;
      row.appendChild(td);
    });
    tb.appendChild(row);
  });
  t.appendChild(tb);
  return t;
}

function kvTable(obj) {
  var rows = Object.keys(obj || {}).map(function (k) { return [k, JSON.stringify(obj[k])]; });
  return table(["key", "value"], rows);
}

function renderEvaluations() {
  var wrap = el("div");
  var f = el("div", "filters");
  f.appendChild(el("label", null, "Subject type"));
  var st = document.createElement("input"); st.id = "ev_subject";
  f.appendChild(st);
  f.appendChild(el("label", null, "Decision"));
  var dc = document.createElement("select"); dc.id = "ev_decision";
  ["", "ALLOW", "DENY", "REQUIRE_APPROVAL", "REQUIRE_EVIDENCE"].forEach(function (v) {
    var o = document.createElement("option"); o.value = v; o.textContent = v || "any"; dc.appendChild(o);

  var t = table(
    ["decision id", "subject", "action", "decision", "final", "approvals"],
    []
  );
  t.id = "ev_table";
  wrap.appendChild(t);
  function refresh() {
    var rows = [];
    (GOV.evaluations || []).forEach(function (e) {
      var req = e.request || {};
      if (st.value && req.subject_type !== st.value) return;
      var dec = (e.decision && e.decision.decision) || "";
      if (dc.value && dec !== dc.value) return;
      rows.push([
        el("span", "decision_id", e.decision_id),
        (req.subject_type || "") + " / " + (req.subject_id || ""),
        req.action || "",
        badge(dec),
        e.final_decision ? badge(e.final_decision) : "—",
        (e.approval_ids || []).join(", ")
      ]);
    });
    while (t.tBodies[0].rows.length) t.tBodies[0].deleteRow(0);
    rows.forEach(function (r) {
      var tr = document.createElement("tr");
      r.forEach(function (c) { var td = document.createElement("td"); if (c.nodeType === 1) td.appendChild(c); else td.textContent = c; tr.appendChild(td); });
      t.tBodies[0].appendChild(tr);
    });
  }
  st.oninput = refresh; dc.onchange = refresh; refresh();

}

function renderDossier() {

  (GOV.evaluations || []).forEach(function (e) { byId[e.decision_id] = e; });

function renderApprovals() {
  var wrap = el("div");
  wrap.appendChild(el("p", "note", "Read-only queue view. Approve/reject is performed through the kernel API (DashboardService.approve/reject) and is audited — this console never mutates state directly."));
  wrap.appendChild(table(
    ["id", "evaluation", "approver", "required", "status", "timeout", "decision", "comments"],
    (GOV.approvals || []).map(function (a) {
      var req = a.requirement || {};
      return [a.id, a.evaluation_id, req.approver_id, String(req.required),
              badge(a.status), req.timeout_policy, a.decision || "—", a.comments || ""];
    })
  ));
  return wrap;
}

function renderExceptions() {
  var wrap = el("div");
  wrap.appendChild(table(
    ["id", "name", "status", "granted_by", "expires", "uses", "scope", "justification"],
    (GOV.exceptions || []).map(function (e) {
      var scope = e.scope || {};
      return [e.id, e.name, badge(e.status), e.granted_by, e.expires_at,
              (scope.max_uses === null ? "" : scope.use_count + "/" + scope.max_uses),
              JSON.stringify(scope), e.justification];
    })
  ));
  return wrap;
}

function renderAudit() {
  var wrap = el("div");
  var chain = GOV.chain || {};
  wrap.appendChild(el("h2", null, "Hash-chain integrity"));
  var cards = el("div", "cards");
  var card = el("div", "card");
  card.appendChild(el("div", "label", "status"));
  card.appendChild(el("div", "value", chain.status || "?"));
  if (chain.first_broken_index !== null && chain.first_broken_index !== undefined) {
    card.appendChild(el("p", "note", "First broken event at index " + chain.first_broken_index));
  }
  cards.appendChild(card);
  wrap.appendChild(cards);
  wrap.appendChild(el("h2", null, "Events (newest last)"));
  wrap.appendChild(table(
    ["id", "type", "actor", "subject", "action", "decision", "time"],
    (GOV.audit_events || []).map(function (e) {
      return [e.id, e.event_type, e.actor.actor_id, (e.subject_type + " / " + e.subject_id), e.action,
              e.decision_id || "", e.timestamp];
    })
  ));
  return wrap;
}

function renderLineage() {
  var wrap = el("div");
  wrap.appendChild(el("h2", null, "All lineage links"));
  wrap.appendChild(table(
    ["parent", "child", "change type", "decision ref", "rollback ref"],
    (GOV.lineage || []).map(function (l) {
      return [l.parent_artifact_type + " / " + l.parent_artifact_id,
              l.child_artifact_type + " / " + l.child_artifact_id,
              l.change_type, l.decision_ref || "", l.rollback_plan_ref || ""];
    })
  ));
  return wrap;
}

var RENDERERS = {
  health: renderHealth, policy: renderPolicy, evaluations: renderEvaluations,
  dossier: renderDossier, approvals: renderApprovals, exceptions: renderExceptions,
  audit: renderAudit, lineage: renderLineage
};

function init() {
  var nav = document.getElementById("tabs");
  var main = document.getElementById("main");
  TAB_DEFS.forEach(function (def) {
    var b = document.createElement("button");
    b.textContent = def.label;
    b.onclick = function () {
      Array.prototype.forEach.call(nav.children, function (c) { c.classList.remove("active"); });
      b.classList.add("active");
      main.innerHTML = "";
      var sec = el("section", "tab active");
      sec.appendChild(RENDERERS[def.id]());
      main.appendChild(sec);
    };
    nav.appendChild(b);
  });
  nav.children[0].click();
}
init();
</script>
</body>
</html>
