apiVersion: apps/v1
kind: Deployment
metadata:
  name: esap-dashboard
  labels: { app: esap-dashboard }
spec:
  replicas: 2
  selector:
    matchLabels: { app: esap-dashboard }
  template:
    metadata:
      labels: { app: esap-dashboard }
    spec:
      containers:
        - name: dashboard
          image: ghcr.io/kimiti4/esap-dashboard:v1.1.0
          ports: [{ containerPort: 8080 }]
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 200m, memory: 128Mi }
          readinessProbe:
            httpGet: { path: /, port: 8080 }
            initialDelaySeconds: 3
          livenessProbe:
            httpGet: { path: /, port: 8080 }
            initialDelaySeconds: 10
          volumeMounts:
            - name: runtime-config
              mountPath: /usr/share/nginx/html/config
              readOnly: true
      volumes:
        - name: runtime-config
          configMap:
            name: esap-dashboard-config
