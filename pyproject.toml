[project]
name = "knowledge-graph-runtime"
version = "0.1.0"
description = "Phase 23 Enterprise Knowledge Graph runtime"
requires-python = ">=3.11"
dependencies = [
  # Deployment contract (vertical_slice/deployment.py DEPENDENCY_VERSIONS):
  # pinned exactly so uv.lock resolves the same versions the vs1 contract
  # asserts; tests/vs1/test_deployment.py fails CI if the two drift.
  "fastapi==0.136.0",
  "uvicorn==0.45.0",
  "pydantic==2.13.0",
  "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pyyaml>=6.0",
  "hypothesis>=6.0",
  "alembic>=1.13",
]

[tool.setuptools.packages.find]
include = [
  "knowledge*",
]

[tool.pytest.ini_options]
# Canonical run target: the project's unit-test suite lives under tests/.
# --import-mode=importlib avoids the "No module named 'tests.test_*'"
# package-name collisions caused by the multiple */tests/ directories
# shipped across autonomous-api/, constitutional_architecture/, and generated/.
testpaths = ["tests"]
# The canonical unit run EXCLUDES real-Docker integration gates AND the
# expensive Phase 31 certification harness (scale 26/100/500 + full matrix +
# taxonomy + fresh calibration), which can take 20+ minutes per file.
#   - Tier A (fast, default): `pytest`            — unit/contract + cbc1 gates
#   - Tier B (integration):   `pytest -m "not certification"` + docker_integration opt-in
#   - Tier C (certification): `pytest -m certification`      — authoritative release gate
addopts = "--import-mode=importlib -m 'not docker_integration and not certification'"
markers = [
    "docker_integration: real infrastructure gate (pulls/executes Docker). Excluded from the canonical unit run; opt in with -m docker_integration.",
    "certification: expensive Phase 31 certification harness (scale ramp + matrix + taxonomy + fresh calibration). Excluded from the canonical unit run; the authoritative release gate runs `pytest -m certification`.",
]
# Make root-level packages (compiler, knowledge, civilization, learning, ...)
# importable when invoking the pytest entry point directly.
pythonpath = ["."]
